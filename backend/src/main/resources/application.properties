# Server Configuration
server.port=8080

# LLM Provider Configuration
llm.type=claude
llm.apiKey=${CLAUDE_API_KEY}
llm.model=claude-3-7-sonnet-latest
llm.maxTokens=4096
llm.temperature=0.7
llm.endpoint=https://api.anthropic.com/v1/messages

# Autonomous Agent Configuration
agent.max.iterations=50
agent.iteration.delay.ms=1000
agent.planning.depth.default=2
agent.enable.proactive=true
agent.enable.continuous=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.ai.developer=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
