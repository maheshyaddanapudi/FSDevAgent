spring.application.name=ai-developer-agent
server.port=8080
# LLM Configuration
llm.type=claude
llm.apiKey=${CLAUDE_API_KEY:}
llm.model=claude-3-7-sonnet-latest
llm.temperature=0.7
llm.maxTokens=4096
llm.streaming=true
# Logging
logging.level.root=INFO
logging.level.com.ai.developer=DEBUG
# Separate Error Log Configuration
logging.file.name=/home/ubuntu/backend_logs.txt
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=5
# Error Log Configuration
logging.file.path=/home/ubuntu
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
# Create separate error log file
logging.config=classpath:logback-spring.xml
# CORS Configuration
spring.webflux.cors.allowed-origins=*
spring.webflux.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.webflux.cors.allowed-headers=*
# Actuator
management.endpoints.web.exposure.include=health,info,metrics
